<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>課堂分組抽籤</title>
  <style>
    :root {
      --ink: #18324a; --muted: #6b7f90; --paper: #f8f4ec; --white: #fffdf8; --line: #d9e1e3;
      --accent: #ee7d52; --accent-dark: #c95d39; --teal: #2c9b93; --danger: #c0392b;
      --shadow: 0 18px 50px rgba(31, 62, 73, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink);
      background: radial-gradient(circle at 10% 0%, #ffe4c8 0 17%, transparent 38%),
                  radial-gradient(circle at 100% 100%, #c8e9e1 0 15%, transparent 37%), var(--paper);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; min-height: 100vh;
    }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 30px 0 50px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 22px; }
    .eyebrow { color: var(--accent-dark); font-size: 13px; font-weight: 800; letter-spacing: .2em; margin: 0 0 8px; }
    h1 { font-family: Georgia, "Noto Serif TC", serif; font-size: clamp(30px, 4.5vw, 52px); line-height: 1; letter-spacing: -.04em; margin: 0; }
    .subtitle { color: var(--muted); margin: 10px 0 0; font-size: 15px; }
    h2 { font-family: Georgia, "Noto Serif TC", serif; font-size: 26px; margin: 0; letter-spacing: -.03em; }
    h3 { font-size: 15px; margin: 0 0 10px; }
    .card { background: rgba(255,253,248,.92); border: 1px solid rgba(24,50,74,.1); border-radius: 22px; box-shadow: var(--shadow); padding: 22px; }
    .muted { color: var(--muted); font-size: 13px; }
    label { display: block; font-weight: 800; font-size: 14px; margin: 0 0 7px; }
    input[type=text], input[type=email], input[type=password], select {
      width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; background: #fff; color: var(--ink); font: inherit; outline: none;
    }
    input:focus, select:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(44,155,147,.14); }
    .field { margin-top: 14px; }
    button { border: 0; border-radius: 12px; padding: 11px 15px; font: inherit; font-weight: 800; cursor: pointer; transition: transform .18s ease, filter .18s ease; }
    button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.03); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .primary { color: #fff; background: var(--accent); box-shadow: 0 10px 20px rgba(238,125,82,.22); }
    .secondary { color: var(--ink); background: #e8efec; }
    .danger { color: #fff; background: var(--danger); }
    .ghost { background: transparent; color: var(--muted); padding: 6px 8px; }
    .block { width: 100%; margin-top: 18px; padding: 13px; }
    .row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
    .grow { flex: 1; }
    .hidden { display: none !important; }
    .msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
    .msg.err { color: var(--danger); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .badge.open { background: #d8f1ec; color: #1f7a72; }
    .badge.closed { background: #eee; color: #666; }
    .badge.drawn { background: #ffe4c8; color: var(--accent-dark); }

    /* teacher layout */
    .workspace { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
    .sessions { list-style: none; margin: 12px 0 0; padding: 0; max-height: 60vh; overflow: auto; }
    .sessions li { padding: 10px 12px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; }
    .sessions li:hover { background: #f1ede4; }
    .sessions li.active { background: #fff; border-color: var(--teal); }
    .sessions .t { font-weight: 800; font-size: 14px; }
    .sessions .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .session-head { display: flex; justify-content: space-between; gap: 16px; align-items: start; flex-wrap: wrap; }
    .qrbox { display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: center; margin-top: 18px; padding: 16px; border: 1px dashed #c7d3d4; border-radius: 16px; background: #fff; }
    .qrbox img, .qrbox canvas { width: 170px; height: 170px; display: block; }
    .code { font-family: ui-monospace, Menlo, monospace; font-size: 30px; letter-spacing: .18em; font-weight: 800; color: var(--teal); }
    .link { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; color: var(--muted); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
    .roster { list-style: none; margin: 10px 0 0; padding: 0; max-height: 380px; overflow: auto; }
    .roster li { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px dashed #e2e7e6; font-size: 14px; }
    .roster li .sid { color: var(--muted); font-size: 12px; }
    .roster li .dup { color: var(--danger); font-size: 11px; font-weight: 800; }
    .roster li button { margin-left: auto; }
    .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 14px; }
    .group { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: #fff; animation: rise .4s both; }
    .group-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; color: #fff; }
    .group-title { font-size: 19px; font-weight: 900; }
    .group-size { font-size: 12px; opacity: .85; }
    .member-list { list-style: none; margin: 0; padding: 10px 15px 12px; }
    .member-list li { padding: 7px 0; border-bottom: 1px dashed #e2e7e6; font-size: 14px; display: flex; justify-content: space-between; }
    .member-list li:last-child { border: 0; }
    .member-list .sid { color: var(--muted); font-size: 12px; }
    .empty { display: grid; place-items: center; text-align: center; color: var(--muted); border: 1px dashed #c7d3d4; border-radius: 16px; padding: 30px; min-height: 160px; }
    @keyframes rise { from { opacity: 0; transform: translateY(13px) scale(.98); } to { opacity: 1; transform: none; } }

    /* projection overlay */
    .overlay { position: fixed; inset: 0; background: var(--paper); z-index: 50; display: grid; place-items: center; text-align: center; padding: 30px; }
    .overlay .big { font-size: clamp(40px, 6vw, 80px); font-family: Georgia, "Noto Serif TC", serif; letter-spacing: -.03em; margin: 0 0 20px; }
    .overlay canvas, .overlay img { width: min(60vh, 90vw); height: auto; background: #fff; padding: 20px; border-radius: 24px; box-shadow: var(--shadow); }
    .overlay .code { font-size: clamp(36px, 6vw, 72px); margin-top: 18px; }
    .overlay .count { font-size: 24px; color: var(--muted); margin-top: 10px; }
    .overlay .close { position: fixed; top: 20px; right: 20px; }

    /* student layout */
    .student { width: min(520px, calc(100% - 28px)); margin: 0 auto; padding: 26px 0 40px; }
    .student h1 { font-size: 34px; }
    .pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--teal); margin-right: 8px; animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%, 100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
    .result-hero { border-radius: 22px; color: #fff; padding: 28px 24px; text-align: center; animation: rise .5s both; }
    .result-hero .label { font-size: 14px; opacity: .9; letter-spacing: .2em; }
    .result-hero .num { font-size: 84px; font-weight: 900; line-height: 1.05; font-family: Georgia, "Noto Serif TC", serif; }
    .result-hero .me { margin-top: 8px; font-size: 16px; opacity: .95; }
    .mates { margin-top: 16px; }

    @media (max-width: 860px) {
      .workspace { grid-template-columns: 1fr; }
      .two { grid-template-columns: 1fr; }
      .qrbox { grid-template-columns: 1fr; text-align: center; }
      .qrbox img, .qrbox canvas { margin: 0 auto; }
      header { display: block; }
    }
  </style>
</head>
<body>

<script>
  // 到 Firebase Console → 專案設定 → 「你的應用程式」→ Web 應用程式 → SDK 設定與配置，複製 firebaseConfig 貼到這裡。
  const firebaseConfig = {
    apiKey: "AIzaSyC7h4Mn6jMUuz1LzZ6U3dKp0WVhR8xSnXU",
    authDomain: "class-grouping-3cadb.firebaseapp.com",
    projectId: "class-grouping-3cadb",
    storageBucket: "class-grouping-3cadb.firebasestorage.app",
    messagingSenderId: "531127499714",
    appId: "1:531127499714:web:cc24745530201f8691f45b"
  };
  const COURSE_NAME = "課堂分組抽籤";   // 顯示在頁面標題，可改成課程名稱
</script>
<!-- ============================================================================ -->

<div id="app"></div>

<!-- Firebase (compat 版本，可直接用 <script> 載入) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<!-- QR code 產生器 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
(() => {
  'use strict';
  const app = document.getElementById('app');
  const COLORS = ['#2468a9', '#2c9b93', '#e49322', '#d95d66', '#7652a8', '#3f8b72', '#bd6f35', '#3777a7', '#8a5a44', '#4b7bec'];
  const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const params = new URLSearchParams(location.search);
  const sessionParam = (params.get('s') || '').toUpperCase();
  const baseUrl = location.origin + location.pathname;

  // ---------- 未設定 Firebase 時的提示 ----------
  if (!firebaseConfig || firebaseConfig.apiKey === 'PASTE_ME') {
    app.innerHTML = `<div class="student"><div class="card"><h2>尚未設定 Firebase</h2>
      <p class="muted">請打開 index.html，把 Firebase Console 提供的 <code>firebaseConfig</code> 貼到檔案開頭的設定區，再重新上傳。詳細步驟請見 README。</p></div></div>`;
    return;
  }

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const TS = firebase.firestore.FieldValue.serverTimestamp;

  const fmtDate = ts => {
    const d = ts && ts.toDate ? ts.toDate() : (ts instanceof Date ? ts : null);
    if (!d) return '';
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  };
  const todayTitle = () => { const d = new Date(); return `${d.getMonth()+1}/${d.getDate()} 課堂分組`; };
  const genCode = () => { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 6; i++) s += A[Math.floor(Math.random()*A.length)]; return s; };
  const shuffle = list => { const r = [...list]; for (let i = r.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
  const makeQR = (el, text, size) => { el.innerHTML = ''; new QRCode(el, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M }); };
  const groupsText = (title, groups) => groups.map((g, i) => `第 ${i+1} 組（${g.members.length} 人）\n${g.members.map((m, k) => `${k+1}. ${m.name}（${m.studentId}）`).join('\n')}`).join('\n\n');

  if (sessionParam) studentMode(); else teacherMode();

  // =====================================================================
  //  學生端
  // =====================================================================
  function studentMode() {
    const code = sessionParam;
    let uid = null, session = null, myDoc = null, unsubS = null, unsubMe = null, unsubCount = null, count = 0;

    app.innerHTML = `<div class="student">
      <header style="display:block"><p class="eyebrow">${esc(COURSE_NAME)}</p><h1>今天，和誰一組？</h1><p class="subtitle">場次代碼 <b>${esc(code)}</b></p></header>
      <div class="card" id="panel"><p class="muted">連線中…</p></div>
    </div>`;
    const panel = document.getElementById('panel');

    auth.signInAnonymously().catch(e => panel.innerHTML = `<p class="msg err">無法連線：${esc(e.message)}</p>`);
    auth.onAuthStateChanged(user => {
      if (!user) return;
      uid = user.uid;
      const ref = db.collection('sessions').doc(code);
      unsubS = ref.onSnapshot(snap => {
        if (!snap.exists) { panel.innerHTML = `<h2>找不到這個場次</h2><p class="muted">請確認 QR code 或代碼是否正確，或請老師重新產生。</p>`; return; }
        session = snap.data(); render();
      }, e => panel.innerHTML = `<p class="msg err">讀取失敗：${esc(e.message)}</p>`);
      unsubMe = ref.collection('students').doc(uid).onSnapshot(snap => { myDoc = snap.exists ? snap.data() : null; render(); });
      unsubCount = ref.collection('students').onSnapshot(snap => { count = snap.size; render(); });
    });

    let editing = false, lastView = '';
    function render() {
      if (!session) return;
      const groups = session.groups || null;
      const myIdx = groups ? groups.findIndex(g => g.members.some(m => m.uid === uid)) : -1;

      // 判斷目前應顯示哪個畫面；若畫面沒變（只是人數更新），只更新數字，不重畫表單，避免同學輸入到一半被清掉
      const view = groups && myIdx >= 0 ? `result:${myIdx}:${groups[myIdx].members.length}`
        : groups && myDoc ? 'unassigned'
        : myDoc && !editing ? `waiting:${myDoc.name}:${myDoc.studentId}:${session.status}`
        : session.status !== 'open' && !myDoc ? 'closed'
        : `form:${editing}`;
      if (view === lastView) {
        const c = document.getElementById('countTxt'); if (c) c.textContent = count;
        return;
      }
      lastView = view;

      // 已分組
      if (groups && myIdx >= 0) {
        const g = groups[myIdx];
        panel.innerHTML = `<div class="result-hero" style="background:${COLORS[myIdx % COLORS.length]}">
            <div class="label">你的組別</div><div class="num">第 ${myIdx+1} 組</div>
            <div class="me">${esc(myDoc?.name || '')}　${esc(myDoc?.studentId || '')}</div></div>
          <div class="mates"><h3>組員（${g.members.length} 人）</h3>
            <ul class="member-list">${g.members.map(m => `<li><span>${esc(m.name)}${m.uid === uid ? '（你）' : ''}</span><span class="sid">${esc(m.studentId)}</span></li>`).join('')}</ul></div>
          <p class="muted" style="margin-top:14px">請找到你的組員，一起坐到同一區。</p>`;
        return;
      }
      // 已抽籤但自己不在名單
      if (groups && myDoc) {
        panel.innerHTML = `<h2>老師已完成抽籤</h2><p class="muted" style="margin-top:8px">但你（${esc(myDoc.name)}）還沒有被分到組別，可能是抽籤後才報到。請舉手告訴老師，老師可以把你補進人數最少的組。</p>`;
        return;
      }
      // 已報到，等待
      if (myDoc && !editing) {
        panel.innerHTML = `<h2>報到完成 ✓</h2>
          <p style="margin:10px 0 0;font-size:16px"><b>${esc(myDoc.name)}</b>　<span class="muted">${esc(myDoc.studentId)}</span></p>
          <p class="muted" style="margin-top:18px"><span class="pulse"></span>目前 <span id="countTxt">${count}</span> 位同學已報到，等待老師抽籤…結果會直接出現在這裡，請不要關閉頁面。</p>
          ${session.status === 'open' ? `<button class="ghost" id="editBtn" type="button">資料打錯了？修改</button>` : ''}`;
        document.getElementById('editBtn')?.addEventListener('click', () => { editing = true; render(); });
        return;
      }
      // 報到已截止
      if (session.status !== 'open' && !myDoc) {
        panel.innerHTML = `<h2>報到已截止</h2><p class="muted" style="margin-top:8px">老師已關閉這個場次的報到，請直接告訴老師你的姓名與學號。</p>`;
        return;
      }
      // 報到表單
      panel.innerHTML = `<h2>${editing ? '修改資料' : '請報到'}</h2>
        <p class="muted" style="margin-top:6px">目前 <span id="countTxt">${count}</span> 位同學已報到</p>
        <div class="field"><label for="name">姓名</label><input id="name" type="text" maxlength="30" autocomplete="name" value="${esc(myDoc?.name || '')}"></div>
        <div class="field"><label for="sid">學號</label><input id="sid" type="text" maxlength="20" autocomplete="off" autocapitalize="characters" value="${esc(myDoc?.studentId || '')}"></div>
        <button class="primary block" id="joinBtn" type="button">${editing ? '儲存' : '完成報到'}</button>
        ${editing ? `<button class="ghost block" id="cancelBtn" type="button" style="margin-top:6px">取消</button>` : ''}
        <p class="msg err" id="msg"></p>`;
      document.getElementById('cancelBtn')?.addEventListener('click', () => { editing = false; render(); });
      document.getElementById('joinBtn').addEventListener('click', async () => {
        const name = document.getElementById('name').value.trim();
        const studentId = document.getElementById('sid').value.trim().toUpperCase();
        const msg = document.getElementById('msg');
        if (!name || !studentId) { msg.textContent = '請填寫姓名與學號'; return; }
        const btn = document.getElementById('joinBtn'); btn.disabled = true; btn.textContent = '送出中…';
        try {
          await db.collection('sessions').doc(code).collection('students').doc(uid).set({ name, studentId, joinedAt: myDoc?.joinedAt || TS(), updatedAt: TS() });
          editing = false;
        } catch (e) { msg.textContent = '送出失敗：' + (e.code === 'permission-denied' ? '報到可能已截止' : e.message); btn.disabled = false; btn.textContent = '完成報到'; }
      });
    }
  }

  // =====================================================================
  //  老師端
  // =====================================================================
  function teacherMode() {
    let user = null, sessions = [], current = null, students = [], unsubList = null, unsubSession = null, unsubStudents = null;
    let overlayOn = false;

    auth.onAuthStateChanged(u => {
      user = u && !u.isAnonymous ? u : null;
      if (!user) { cleanup(); renderLogin(); return; }
      renderShell();
      unsubList = db.collection('sessions').orderBy('createdAt', 'desc').limit(100).onSnapshot(snap => {
        sessions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderSessionList();
        if (!current && sessions.length) selectSession(sessions[0].id);
        if (current && !sessions.some(s => s.id === current.id)) { current = null; renderMain(); }
      }, e => alert('讀取場次失敗：' + e.message));
    });

    function cleanup() { unsubList?.(); unsubSession?.(); unsubStudents?.(); unsubList = unsubSession = unsubStudents = null; current = null; sessions = []; students = []; }

    function renderLogin() {
      app.innerHTML = `<div class="student">
        <header style="display:block"><p class="eyebrow">${esc(COURSE_NAME)}</p><h1>老師登入</h1><p class="subtitle">使用 Firebase 建立的教師帳號登入，即可建立場次與抽籤。</p></header>
        <div class="card">
          <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username"></div>
          <div class="field"><label for="pw">密碼</label><input id="pw" type="password" autocomplete="current-password"></div>
          <button class="primary block" id="loginBtn" type="button">登入</button>
          <p class="msg err" id="msg"></p>
          <p class="muted">學生請掃描老師提供的 QR code，不需要登入。</p>
        </div></div>`;
      const go = async () => {
        const msg = document.getElementById('msg'); msg.textContent = '';
        try { await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(), document.getElementById('pw').value); }
        catch (e) { msg.textContent = '登入失敗：' + e.message; }
      };
      document.getElementById('loginBtn').addEventListener('click', go);
      document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    }

    function renderShell() {
      app.innerHTML = `<div class="shell">
        <header>
          <div><p class="eyebrow">${esc(COURSE_NAME)} / 教師端</p><h1>今天，和誰一組？</h1><p class="subtitle">建立場次 → 投影 QR code 讓同學報到 → 開始抽籤，結果會即時推送到每位同學的手機。</p></div>
          <div class="row"><span class="muted">${esc(user.email)}</span><button class="ghost" id="logoutBtn" type="button">登出</button></div>
        </header>
        <section class="workspace">
          <aside class="card">
            <h3>場次紀錄</h3>
            <div class="row"><input id="newTitle" type="text" class="grow" placeholder="${esc(todayTitle())}"></div>
            <button class="primary block" id="newBtn" type="button" style="margin-top:10px">＋ 建立新場次</button>
            <ul class="sessions" id="sessionList"></ul>
          </aside>
          <section class="card" id="main"></section>
        </section>
      </div>
      <div id="overlay" class="overlay hidden"></div>`;
      document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());
      document.getElementById('newBtn').addEventListener('click', createSession);
    }

    async function createSession() {
      const input = document.getElementById('newTitle');
      const title = input.value.trim() || todayTitle();
      const id = genCode();
      try {
        await db.collection('sessions').doc(id).set({ title, status: 'open', groupCount: 6, groups: null, createdAt: TS(), drawnAt: null, createdBy: user.email });
        input.value = ''; selectSession(id);
      } catch (e) { alert('建立失敗：' + e.message); }
    }

    function renderSessionList() {
      const ul = document.getElementById('sessionList'); if (!ul) return;
      ul.innerHTML = sessions.map(s => `<li data-id="${s.id}" class="${current && s.id === current.id ? 'active' : ''}">
        <div class="t">${esc(s.title)}</div><div class="d">${esc(fmtDate(s.createdAt)) || '建立中…'} · ${s.id} · ${s.groups ? '已抽籤' : (s.status === 'open' ? '報到中' : '已關閉')}</div></li>`).join('')
        || `<li class="muted">尚無場次，先建立一個吧。</li>`;
      ul.querySelectorAll('li[data-id]').forEach(li => li.addEventListener('click', () => selectSession(li.dataset.id)));
    }

    function selectSession(id) {
      unsubSession?.(); unsubStudents?.();
      const ref = db.collection('sessions').doc(id);
      current = { id }; students = [];
      unsubSession = ref.onSnapshot(snap => { if (!snap.exists) { current = null; renderMain(); return; } current = { id, ...snap.data() }; renderSessionList(); renderMain(); });
      unsubStudents = ref.collection('students').orderBy('joinedAt').onSnapshot(snap => { students = snap.docs.map(d => ({ uid: d.id, ...d.data() })); renderMain(); });
    }

    function renderMain() {
      const main = document.getElementById('main'); if (!main) return;
      if (!current || !current.title) { main.innerHTML = `<div class="empty"><div><strong>選擇左側場次，或建立新場次</strong></div></div>`; return; }
      const s = current, groups = s.groups || null;
      const link = `${baseUrl}?s=${s.id}`;
      const badge = groups ? `<span class="badge drawn">已抽籤</span>` : (s.status === 'open' ? `<span class="badge open">報到中</span>` : `<span class="badge closed">已關閉報到</span>`);
      const assigned = new Set(groups ? groups.flatMap(g => g.members.map(m => m.uid)) : []);
      const unassigned = groups ? students.filter(st => !assigned.has(st.uid)) : [];
      const idCount = {}; students.forEach(st => idCount[st.studentId] = (idCount[st.studentId] || 0) + 1);

      main.innerHTML = `
        <div class="session-head">
          <div><h2>${esc(s.title)} ${badge}</h2><p class="muted" style="margin:6px 0 0">建立於 ${esc(fmtDate(s.createdAt))}${s.drawnAt ? ` · 抽籤於 ${esc(fmtDate(s.drawnAt))}` : ''}</p></div>
          <div class="row">
            <button class="secondary" id="projBtn" type="button">投影 QR code</button>
            <button class="secondary" id="toggleBtn" type="button">${s.status === 'open' ? '關閉報到' : '重新開放報到'}</button>
            <button class="ghost" id="delBtn" type="button">刪除場次</button>
          </div>
        </div>
        <div class="qrbox">
          <div id="qr"></div>
          <div><div class="muted">同學掃描 QR code，或在瀏覽器輸入下方網址</div><div class="code">${s.id}</div><div class="link">${esc(link)}</div>
            <div class="row" style="margin-top:8px"><button class="secondary" id="copyLinkBtn" type="button">複製網址</button></div></div>
        </div>
        <div class="two">
          <div>
            <div class="row"><h3 style="margin:0">已報到 <span style="color:var(--teal)">${students.length}</span> 人</h3></div>
            <ul class="roster" id="roster">${students.map((st, i) => `<li><span class="muted" style="width:26px">${i+1}</span><span>${esc(st.name)}</span><span class="sid">${esc(st.studentId)}</span>${idCount[st.studentId] > 1 ? `<span class="dup">學號重複</span>` : ''}<button class="ghost" data-rm="${st.uid}" type="button" title="移除">✕</button></li>`).join('') || `<li class="muted">還沒有人報到。</li>`}</ul>
          </div>
          <div>
            <h3>抽籤</h3>
            <label for="gc">分成幾組？</label>
            <select id="gc">${[2,3,4,5,6,7,8,9,10].map(n => `<option value="${n}" ${n === (s.groupCount || 6) ? 'selected' : ''}>${n} 組</option>`).join('')}</select>
            <button class="primary block" id="drawBtn" type="button" ${students.length < 2 ? 'disabled' : ''}>${groups ? '重新抽籤（覆蓋原結果）' : '開始抽籤'}</button>
            ${unassigned.length ? `<button class="secondary block" id="fillBtn" type="button" style="margin-top:8px">補分 ${unassigned.length} 位晚報到的同學到人數最少的組</button>` : ''}
            <p class="muted" style="margin-top:10px">每組人數最多只差 1 人。抽籤後結果會立刻顯示在同學手機上。</p>
          </div>
        </div>
        <div style="margin-top:22px">
          <div class="row"><h3 style="margin:0" class="grow">分組結果</h3>
            ${groups ? `<button class="secondary" id="copyBtn" type="button">複製結果</button><button class="secondary" id="csvBtn" type="button">匯出 CSV</button>` : ''}</div>
          ${groups ? `<div class="groups">${groups.map((g, i) => `<article class="group" style="animation-delay:${i*60}ms"><div class="group-head" style="background:${COLORS[i % COLORS.length]}"><span class="group-title">第 ${i+1} 組</span><span class="group-size">${g.members.length} 人</span></div>
              <ul class="member-list">${g.members.map(m => `<li><span>${esc(m.name)}</span><span class="sid">${esc(m.studentId)}</span></li>`).join('')}</ul></article>`).join('')}</div>`
            : `<div class="empty"><div><strong>尚未抽籤</strong><br><span class="muted">等同學報到完畢後按「開始抽籤」</span></div></div>`}
        </div>`;

      makeQR(document.getElementById('qr'), link, 170);
      document.getElementById('projBtn').addEventListener('click', () => { overlayOn = true; renderOverlay(); });
      document.getElementById('copyLinkBtn').addEventListener('click', e => copyText(link, e.target));
      document.getElementById('toggleBtn').addEventListener('click', () => db.collection('sessions').doc(s.id).update({ status: s.status === 'open' ? 'closed' : 'open' }));
      document.getElementById('delBtn').addEventListener('click', () => deleteSession(s.id));
      document.getElementById('gc').addEventListener('change', e => db.collection('sessions').doc(s.id).update({ groupCount: Number(e.target.value) }));
      document.getElementById('drawBtn').addEventListener('click', () => draw(false));
      document.getElementById('fillBtn')?.addEventListener('click', () => draw(true));
      document.getElementById('copyBtn')?.addEventListener('click', e => copyText(groupsText(s.title, groups), e.target));
      document.getElementById('csvBtn')?.addEventListener('click', () => exportCsv(s, groups));
      main.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
        const st = students.find(x => x.uid === b.dataset.rm);
        if (confirm(`移除 ${st.name}（${st.studentId}）的報到？`)) db.collection('sessions').doc(s.id).collection('students').doc(st.uid).delete();
      }));
      if (overlayOn) renderOverlay();
    }

    async function draw(fillOnly) {
      const s = current; const count = Number(document.getElementById('gc').value);
      const pick = st => ({ uid: st.uid, name: st.name, studentId: st.studentId });
      let groups;
      if (fillOnly && s.groups) {
        groups = s.groups.map(g => ({ members: [...g.members] }));
        const assigned = new Set(groups.flatMap(g => g.members.map(m => m.uid)));
        shuffle(students.filter(st => !assigned.has(st.uid))).forEach(st => {
          groups.reduce((a, b) => b.members.length < a.members.length ? b : a).members.push(pick(st));
        });
      } else {
        if (students.length < count) { alert(`目前只有 ${students.length} 人，少於 ${count} 組。`); return; }
        if (s.groups && !confirm('已有抽籤結果，確定要重新抽籤？同學手機上的組別會被更新。')) return;
        groups = Array.from({ length: count }, () => ({ members: [] }));
        shuffle(students).forEach((st, i) => groups[i % count].members.push(pick(st)));
      }
      try { await db.collection('sessions').doc(s.id).update({ groups, groupCount: fillOnly ? s.groupCount : count, drawnAt: TS(), status: 'closed' }); }
      catch (e) { alert('寫入失敗：' + e.message); }
    }

    async function deleteSession(id) {
      if (!confirm('刪除這個場次及所有報到資料？此動作無法復原。')) return;
      const ref = db.collection('sessions').doc(id);
      const snap = await ref.collection('students').get();
      const batch = db.batch(); snap.docs.forEach(d => batch.delete(d.ref)); batch.delete(ref);
      try { await batch.commit(); current = null; } catch (e) { alert('刪除失敗：' + e.message); }
    }

    function renderOverlay() {
      const ov = document.getElementById('overlay'); if (!ov || !current) return;
      const link = `${baseUrl}?s=${current.id}`;
      ov.classList.remove('hidden');
      if (!ov.dataset.for || ov.dataset.for !== current.id) {
        ov.dataset.for = current.id;
        ov.innerHTML = `<div><button class="secondary close" id="closeOv" type="button">關閉 (Esc)</button>
          <p class="big">掃描 QR code 報到</p><div id="bigqr"></div><div class="code">${current.id}</div><div class="count" id="ovCount"></div></div>`;
        makeQR(document.getElementById('bigqr'), link, 600);
        document.getElementById('closeOv').addEventListener('click', closeOverlay);
      }
      document.getElementById('ovCount').textContent = `已報到 ${students.length} 人`;
    }
    function closeOverlay() { overlayOn = false; const ov = document.getElementById('overlay'); ov.classList.add('hidden'); ov.dataset.for = ''; }
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlayOn) closeOverlay(); });

    async function copyText(text, btn) {
      try { await navigator.clipboard.writeText(text); const old = btn.textContent; btn.textContent = '已複製！'; setTimeout(() => btn.textContent = old, 1500); }
      catch { prompt('請手動複製：', text); }
    }
    function exportCsv(s, groups) {
      const rows = [['場次', '日期', '組別', '姓名', '學號']];
      groups.forEach((g, i) => g.members.forEach(m => rows.push([s.title, fmtDate(s.createdAt), `第${i+1}組`, m.name, m.studentId])));
      const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      a.download = `${s.title.replace(/[\\/:*?"<>|]/g, '_')}_分組.csv`; a.click(); URL.revokeObjectURL(a.href);
    }
  }
})();
</script>
</body>
</html>
